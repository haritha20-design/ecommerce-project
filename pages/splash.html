<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopNest - Splash</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* Splash Screen */

        .splash {
            width: 100%;
            height: 100vh;
            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f7f2ec;
        }

        /* Background Image */

        .splash img {
            position: absolute;

            width: 100%;
            height: 100%;

            object-fit: cover;

            opacity: 0.18;
        }

        /* Content */

        .content {
            position: relative;
            z-index: 2;

            text-align: center;
        }

        .logo {
            width: 90px;
            height: 90px;

            margin: auto;
            margin-bottom: 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background: white;

            font-size: 45px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .content h1 {
            font-size: 52px;

            letter-spacing: 3px;

            color: #222;

            margin-bottom: 10px;
        }

        .content p {
            font-size: 18px;

            color: #666;

            letter-spacing: 1px;
        }

        /* Loading Animation */

        .loader {
            width: 45px;
            height: 45px;

            margin: 35px auto 15px;

            border: 4px solid #ddd;

            border-top: 4px solid #222;

            border-radius: 50%;

            animation: spin 1s linear infinite;
        }

        .loading-text {
            font-size: 13px;

            color: #777;

            letter-spacing: 1px;
        }

        /* Animation */

        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }

        /* Mobile Responsive */

        @media (max-width: 600px) {

            .logo {
                width: 75px;
                height: 75px;

                font-size: 35px;
            }

            .content h1 {
                font-size: 38px;
            }

            .content p {
                font-size: 15px;
            }

        }

    </style>
</head>

<body>

    <!-- Splash Page -->

    <div class="splash">

        <!-- Your Image -->
        <img src="images/splash.jpg" alt="ShopNest">

        <div class="content">

            <div class="logo">
                🛍️
            </div>

            <h1>ShopNest</h1>

            <p>Your Style. Your Choice.</p>

            <div class="loader"></div>

            <div class="loading-text">
                Loading...
            </div>

        </div>

    </div>


    <!-- JavaScript -->

    <script>

        setTimeout(function () {

            window.location.href = "login.html";

        }, 3000);

    </script>

</body>

</html>
